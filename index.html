<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Профиль</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<main>
  <section class="profile-my">
    <h1>Мой профиль</h1>
  </section>

  <section class="profile-card">
    <div class="profile-card__avatar" aria-hidden="true"> <h2>кодим с помощью claude</h2> </div>
    <h2 class="profile-card__title">Владимир gym</h2>
    <p class="profile-card__text">
      Что мы не умеем кодим
    </p>

    <ul class="profile-card__skills">
      <li class="skill">HTML</li>
      <li class="skill">CSS</li>
      <li class="skill skill--accent">JavaScript</li>
      <li class="skill">Git</li>
    </ul>

    <a href="https://developer.mozilla.org/ru/" target="_blank" rel="noopener" class="profile-card__link">
      заглушка
    </a>
  </section>

  
  <section class="profile-card profile-card--alt">
    <div class="profile-card__avatar" aria-hidden="true"> <h2>Профиль участника</h2></div>
    <h2 class="profile-card__title">Герман gym</h2>
    <p class="profile-card__text">
      Он точно не умеет
    </p>

    <ul class="profile-card__skills">
      <li class="skill">Жить</li>
      <li class="skill skill--accent">CSS</li>
      <li class="skill">python</li>
    </ul>

    <a href="https://web.dev/" target="_blank" rel="noopener" class="profile-card__link">
      заглушка
    </a>
  </section>

</main>
</body>
</html>
